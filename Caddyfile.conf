{
	email {$ACME_EMAIL}
	admin off
}

https://{$DOMAIN}:{$HTTPS_PORT} {
	encode zstd gzip

	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
		-Server
	}

	reverse_proxy mattermost:8065 {
		transport http {
			read_timeout 15m
			write_timeout 15m
		}
	}
}
